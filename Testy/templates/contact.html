<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicons/favicon-contact.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            background: #000;
            padding: 20px;
        }

        .video-bg { position: fixed; inset: 0; z-index: -1; }
        #bg-video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.3) saturate(0.5); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 0; }

        .contact-card {
            position: relative;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid #333;
            text-align: center;
            color: #fff;
            width: 100%;
            max-width: 440px;
        }

        .nav-links {
            margin-bottom: 36px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 24px;
        }

        .nav-links a {
            color: #555;
            text-decoration: none;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: color 0.3s;
        }

        .nav-links a.active { color: #fff; }
        .nav-links a:hover { color: #aaa; }

        h2 { font-weight: 300; margin-bottom: 32px; letter-spacing: 2px; font-size: clamp(1.1rem, 4vw, 1.4rem); }

        .links-list { display: flex; flex-direction: column; gap: 12px; }

        .link-item {
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border: 1px solid #222;
            text-decoration: none;
            color: #fff;
            border-radius: 12px;
            transition: background 0.3s, transform 0.3s;
            font-size: 0.9rem;
            gap: 14px;
        }

        .link-item i { font-size: 1.2rem; min-width: 20px; transition: color 0.3s; }
        .link-item .label { flex: 1; text-align: left; }

        .link-item:hover { background: #fff; color: #000; transform: translateX(8px); }
        .link-item:hover i { color: #000 !important; }

        .link-item.bot i    { color: #64b5f6; }
        .link-item.telegram i { color: #29b6f6; }
        .link-item.github i { color: #fff; }

        @media (max-width: 480px) {
            .contact-card { padding: 36px 22px; }
            .link-item { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="video-bg">
        <video id="bg-video" autoplay muted loop playsinline>
            <source src="/static/images/contact-bg.mp4" type="video/mp4">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="contact-card">
        <nav class="nav-links">
            <a href="/">Главная</a>
            <a href="/weather">Погода</a>
            <a href="/contacts" class="active">Контакты</a>
        </nav>

        <h2>Связаться со мной</h2>

        <div class="links-list">
            <a href="https://t.me/tetris0812_bot" target="_blank" class="link-item bot">
                <i class="fa-solid fa-robot"></i>
                <span class="label">Telegram-бот</span>
            </a>
            <a href="https://t.me/" target="_blank" class="link-item telegram">
                <i class="fa-brands fa-telegram"></i>
                <span class="label">Telegram</span>
            </a>
            <a href="https://github.com/turygin0812a-arch" target="_blank" class="link-item github">
                <i class="fa-brands fa-github"></i>
                <span class="label">GitHub</span>
            </a>
        </div>
    </div>
</body>
</html>
