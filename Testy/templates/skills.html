<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Terminal</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicons/favicon-skills.svg') }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'JetBrains Mono', monospace;
            padding: 16px;
        }

        .video-bg { position: fixed; inset: 0; z-index: -1; }
        .video-bg video { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.15) saturate(0.3); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 0; }

        .terminal-window {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            background: rgba(10,10,10,0.92);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }

        .terminal-header {
            background: #1e1e1e;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid #2a2a2a;
        }

        .controls { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        .window-title {
            color: #666;
            font-size: 12px;
            flex: 1;
            text-align: center;
        }

        .terminal-body { padding: 24px; }

        .console-nav {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .console-nav a {
            color: #555;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .console-nav a.active,
        .console-nav a:hover { color: #27c93f; }

        .glitch-text {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: #27c93f;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .skills-log {
            color: #aaa;
            font-size: clamp(12px, 3vw, 14px);
            line-height: 1.9;
            min-height: 160px;
        }

        .cursor {
            color: #27c93f;
            animation: blink 1s step-end infinite;
            font-size: 14px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        @media (max-width: 480px) {
            .terminal-body { padding: 16px; }
            .window-title { font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="video-bg">
        <video autoplay muted loop playsinline>
            <source src="{{ url_for('static', filename='images/tech-bg.mp4') }}" type="video/mp4">
        </video>
    </div>
    <div class="overlay"></div>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="controls">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="window-title">admin@terminal: ~ skills</div>
        </div>

        <div class="terminal-body">
            <nav class="console-nav">
                <a href="/">main</a>
                <a href="/skills" class="active">skills</a>
                <a href="/contact">contact</a>
            </nav>

            <div class="console-text">
                <h1 class="glitch-text">Dev_Capabilities</h1>
                <div id="typewriter" class="skills-log"></div>
                <span class="cursor">█</span>
            </div>
        </div>
    </div>

    <script>
        const data = [
            "admin@portfolio:~$ fetch --skills",
            "[OK] Python / Flask Backend",
            "[OK] Modern CSS Architecture",
            "[OK] Video Background Integrated",
            "[OK] JavaScript Typewriter Active",
            "[OK] Audio Feedback: Enabled",
            "admin@portfolio:~$ _"
        ];

        const container = document.getElementById('typewriter');
        let lineIndex = 0, charIndex = 0;

        function typeLine() {
            if (lineIndex < data.length) {
                if (charIndex < data[lineIndex].length) {
                    container.innerHTML += data[lineIndex].charAt(charIndex);
                    charIndex++;
                    setTimeout(typeLine, 45);
                } else {
                    container.innerHTML += "<br>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeLine, 500);
                }
            }
        }

        window.onload = () => setTimeout(typeLine, 800);
    </script>
</body>
</html>
