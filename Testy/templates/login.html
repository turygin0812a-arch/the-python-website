<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicons/favicon-login.svg') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main_site.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
        }

        .container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #fff;
            font-weight: 300;
            font-size: 1.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .login-input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .login-input:focus {
            border-color: rgba(255,255,255,0.4);
        }

        .login-input::placeholder { color: rgba(255,255,255,0.35); }

        .cta-button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .cta-button:hover { opacity: 0.85; }

        @media (max-width: 480px) {
            .container { padding: 35px 24px; }
            h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Авторизация</h2>
        <form method="POST">
            <input type="text" name="username" class="login-input" placeholder="Введите имя" required>
            <input type="password" name="password" class="login-input" placeholder="Введите пароль" required>
            <button type="submit" class="cta-button">Войти на сайт</button>
        </form>
    </div>
</body>
</html>
